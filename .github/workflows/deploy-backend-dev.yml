name: Deploy Backend Development

on:
  push:
    branches:
      - develop
    paths:
      - backend/**
      - .github/workflows/deploy-backend-dev.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-development
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_DEV }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT_DEV }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_DEV }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY_DEV }}/${{ vars.ARTIFACT_IMAGE_NAME_BACKEND }}:${{ github.sha }}"
          docker build --tag "$IMAGE" backend
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push image
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          RUNTIME_SERVICE_ACCOUNT="withdev-backend-runtime@${{ vars.GCP_PROJECT_ID_DEV }}.iam.gserviceaccount.com"

          gcloud run deploy "${{ vars.CLOUD_RUN_BACKEND_SERVICE_DEV }}" \
            --image "$IMAGE" \
            --project "${{ vars.GCP_PROJECT_ID_DEV }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "GEMINI_MODEL=${{ vars.GEMINI_MODEL_DEV }},CORS_ALLOWED_ORIGINS=${{ vars.BACKEND_CORS_ALLOWED_ORIGINS_DEV }}" \
            --set-secrets "GEMINI_API_KEY=${{ vars.GEMINI_API_KEY_SECRET_DEV }}:latest" \
            --port 8080 \
            --quiet
