name: Deploy Backend Development

on:
  push:
    branches:
      - develop
    paths:
      - backend/**
      - .github/workflows/deploy-backend-dev.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-development
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_DEV }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT_DEV }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_DEV }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY_DEV }}/${{ vars.ARTIFACT_IMAGE_NAME_BACKEND }}:${{ github.sha }}"
          docker build --tag "$IMAGE" backend
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push image
        run: docker push "$IMAGE"

      - name: Update migration job
        run: |
          RUNTIME_SERVICE_ACCOUNT="withdev-backend-runtime@${{ vars.GCP_PROJECT_ID_DEV }}.iam.gserviceaccount.com"

          gcloud run jobs update "${{ vars.CLOUD_RUN_BACKEND_MIGRATE_JOB_DEV }}" \
            --image "$IMAGE" \
            --project "${{ vars.GCP_PROJECT_ID_DEV }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "GEMINI_MODEL=${{ vars.GEMINI_MODEL_DEV }},CORS_ALLOWED_ORIGINS=${{ vars.BACKEND_CORS_ALLOWED_ORIGINS_DEV }}" \
            --set-secrets "GEMINI_API_KEY=${{ vars.GEMINI_API_KEY_SECRET_DEV }}:latest,DATABASE_URL=${{ vars.DATABASE_URL_SECRET_DEV }}:latest" \
            --set-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE_DEV }}" \
            --command=python \
            --args=-m,alembic,upgrade,head \
            --quiet

      - name: Run migrations
        run: |
          gcloud run jobs execute "${{ vars.CLOUD_RUN_BACKEND_MIGRATE_JOB_DEV }}" \
            --project "${{ vars.GCP_PROJECT_ID_DEV }}" \
            --region "${{ vars.GCP_REGION }}" \
            --wait \
            --quiet

      - name: Deploy to Cloud Run
        run: |
          RUNTIME_SERVICE_ACCOUNT="withdev-backend-runtime@${{ vars.GCP_PROJECT_ID_DEV }}.iam.gserviceaccount.com"

          gcloud run deploy "${{ vars.CLOUD_RUN_BACKEND_SERVICE_DEV }}" \
            --image "$IMAGE" \
            --project "${{ vars.GCP_PROJECT_ID_DEV }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "GEMINI_MODEL=${{ vars.GEMINI_MODEL_DEV }},CORS_ALLOWED_ORIGINS=${{ vars.BACKEND_CORS_ALLOWED_ORIGINS_DEV }},SLACK_CLIENT_ID=${{ vars.SLACK_CLIENT_ID_DEV }},SLACK_REDIRECT_URI=${{ vars.SLACK_REDIRECT_URI_DEV }},FRONTEND_BASE_URL=${{ vars.FRONTEND_BASE_URL_DEV }},AIBOARD_ALLOWED_SERVICE_ACCOUNT=${{ vars.AIBOARD_ALLOWED_SERVICE_ACCOUNT_DEV }},AIBOARD_EXPECTED_AUDIENCE=${{ vars.AIBOARD_EXPECTED_AUDIENCE_DEV }},AIBOARD_API_BASE_URL=${{ vars.AIBOARD_API_BASE_URL_DEV }},AIBOARD_FRONTEND_BASE_URL=${{ vars.AIBOARD_FRONTEND_BASE_URL_DEV }}" \
            --set-secrets "GEMINI_API_KEY=${{ vars.GEMINI_API_KEY_SECRET_DEV }}:latest,DATABASE_URL=${{ vars.DATABASE_URL_SECRET_DEV }}:latest,SLACK_CLIENT_SECRET=${{ vars.SLACK_CLIENT_SECRET_SECRET_DEV }}:latest" \
            --set-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE_DEV }}" \
            --port 8080 \
            --quiet
